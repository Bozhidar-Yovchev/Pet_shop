<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="auth-box">
    <h1>Login</h1>

    <p th:if="${error}" th:text="${error}" style="color:red"></p>
    <p th:if="${param.registered}" style="color:green">Registration successful. You can log in now.</p>
    <p th:if="${param.logout}">You have been logged out.</p>

    <form th:action="@{/login}" method="post">
        <p>Username<br><input type="text" name="username" required></p>
        <p>Password<br><input type="password" name="password" required></p>
        <button type="submit">Login</button>
    </form>

    <p>No account? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>>
