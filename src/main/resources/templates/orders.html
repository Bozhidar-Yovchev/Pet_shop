<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My orders</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>My orders</h1>

<p th:if="${#lists.isEmpty(orders)}">You have no orders yet. <a th:href="@{/products}">Browse products</a></p>

<table border="1" cellpadding="6" th:unless="${#lists.isEmpty(orders)}">
    <tr><th>Order</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr>
    <tr th:each="o : ${orders}">
        <td th:text="'#' + ${o.id}"></td>
        <td th:text="${#temporals.format(o.orderDate, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${o.status}"></td>
        <td th:text="${o.totalAmount} + ' €'"></td>
        <td><a th:href="@{/orders/{id}(id=${o.id})}">Details</a></td>
    </tr>
</table>
</body>
</html>
