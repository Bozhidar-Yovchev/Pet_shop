<div xmlns:th="http://www.thymeleaf.org" th:fragment="nav">
    <a th:href="@{/}">Home</a> |
    <a th:href="@{/products}">Products</a>
    <span th:if="${session.role == 'ADMIN'}">
        | <a th:href="@{/admin/products}">Manage products</a>
        | <a th:href="@{/admin/categories}">Manage categories</a>
    </span>
    <span th:if="${session.customerId != null}">
        | <a th:href="@{/profile}">My profile</a>
        | <a th:href="@{/addresses}">My addresses</a>
        | <span th:text="${session.customerName}"></span>
        | <a th:href="@{/logout}">Logout</a>
    </span>
    <span th:if="${session.customerId == null}">
        | <a th:href="@{/login}">Login</a>
        | <a th:href="@{/register}">Register</a>
    </span>
    <hr>
</div>
