<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Products</h1>

<form class="filters" th:action="@{/products}" method="get">
    <input type="text" name="q" th:value="${q}" placeholder="Search by name">

    <select name="species">
        <option value="">All animals</option>
        <option th:each="s : ${speciesList}" th:value="${s}" th:text="${s}" th:selected="${s == species}"></option>
    </select>

    <select name="ageGroup">
        <option value="">All ages</option>
        <option th:each="a : ${ageGroups}" th:value="${a}" th:text="${a}" th:selected="${a == ageGroup}"></option>
    </select>

    <select name="categoryId">
        <option value="">All categories</option>
        <option th:each="c : ${categories}" th:value="${c.id}"
                th:text="${c.parent != null ? c.parent.name + ' > ' + c.name : c.name}"
                th:selected="${c.id == categoryId}"></option>
    </select>

    <button type="submit">Filter</button>
    <a th:href="@{/products}">Reset</a>
</form>

<p th:if="${#lists.isEmpty(products)}">No products found.</p>

<div class="grid">
    <th:block th:each="p : ${products}">
        <div th:replace="~{fragments/product-card :: card(${p})}"></div>
    </th:block>
</div>
</body>
</html>
