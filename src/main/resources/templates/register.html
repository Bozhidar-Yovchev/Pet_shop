<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<h1>Register</h1>

<form th:action="@{/register}" th:object="${registerDto}" method="post">
    <p>
        <label>Full name <input type="text" th:field="*{fullName}"></label>
        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color:red"></span>
    </p>
    <p>
        <label>Username <input type="text" th:field="*{username}"></label>
        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red"></span>
    </p>
    <p>
        <label>Email <input type="text" th:field="*{email}"></label>
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></span>
    </p>
    <p>
        <label>Password <input type="password" th:field="*{password}"></label>
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red"></span>
    </p>
    <p>
        <label>Repeat password <input type="password" th:field="*{confirmPassword}"></label>
        <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color:red"></span>
    </p>
    <button type="submit">Register</button>
</form>

<p>Already registered? <a th:href="@{/login}">Login</a></p>
</body>
</html>
