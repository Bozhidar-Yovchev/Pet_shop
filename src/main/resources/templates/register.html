<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="auth-box">
    <h1>Register</h1>

    <form th:action="@{/register}" th:object="${registerDto}" method="post">
        <p>Full name<br><input type="text" th:field="*{fullName}">
            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color:red"></span></p>
        <p>Username<br><input type="text" th:field="*{username}">
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red"></span></p>
        <p>Email<br><input type="text" th:field="*{email}">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></span></p>
        <p>Password<br><input type="password" th:field="*{password}">
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red"></span></p>
        <p>Repeat password<br><input type="password" th:field="*{confirmPassword}">
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color:red"></span></p>
        <button type="submit">Register</button>
    </form>

    <p>Already registered? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
