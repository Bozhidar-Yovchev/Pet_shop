<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1 th:text="${title}"></h1>

<p th:if="${error}" th:text="${error}" style="color:red"></p>

<form th:action="@{${formAction}}" method="post">
    <p>Name<br>
        <input type="text" name="name" th:value="${name}" required></p>

    <p>Parent category<br>
        <select name="parentId">
            <option value="">-- main category --</option>
            <option th:each="c : ${mainCategories}" th:value="${c.id}" th:text="${c.name}"
                    th:selected="${c.id == parentId}"></option>
        </select></p>

    <button type="submit">Save</button>
    <a th:href="@{/admin/categories}">Cancel</a>
</form>
</body>
</html>
