spring.application.name=New_Final_Project

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:petshop;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# H2 console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate recreates the schema on every start
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Lazy loading in controllers and Thymeleaf (we skipped EntityGraph)
spring.jpa.open-in-view=true